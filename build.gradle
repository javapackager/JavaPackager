plugins {
	id 'java'    
	id 'maven-publish'
	id 'java-gradle-plugin'
	id 'com.gradle.plugin-publish' version '1.1.0'
	id 'io.codearte.nexus-staging' version '0.21.2'
	id 'eclipse'
	id 'de.undercouch.download' version '5.7.0'
	id 'signing'
}

repositories {
	mavenLocal()
	mavenCentral()
	maven { 
		url = uri('https://plugins.gradle.org/m2/')
	}
}

gradlePlugin {
	website = 'http://github.com/javapackager/JavaPackager'
	vcsUrl = 'http://github.com/javapackager/JavaPackager.git'
	description = 'Packages Java applications as native Windows, MacOS or GNU/Linux executables and creates installers for them'

	plugins {
		create("javaPackagerPlugin") {
			id = 'io.github.javapackager'
			displayName = 'JavaPackager'
			implementationClass = 'io.github.javapackager.gradle.PackagePlugin'
			tags.set(['java', 'packager', 'gradle-plugin', 'maven-plugin', 'native', 'installer', 'debian-packages', 'rpm-packages', 'dmg', 'maven', 'gradle', 'distribution', 'javapackager', 'linux-executables', 'deb', 'rpm', 'native-windows', 'java-applications', 'pkg', 'msi'])
		}
	}
}

// maven-plugin-plugin generates the Maven plugin descriptor (see generatePluginDescriptor)
def mavenPluginPluginVersion = '3.16.0'

configurations {
	mavenEmbedder
}

dependencies {
	implementation 'org.apache.maven:maven-plugin-api:3.6.0'
	implementation 'org.apache.maven:maven-core:3.6.0'
	// jdeb requires plexus-utils 4, which moved Xpp3Dom to plexus-xml (3.x is the Maven 3 compatible line)
	implementation 'org.codehaus.plexus:plexus-utils:4.0.2'
	implementation 'org.codehaus.plexus:plexus-xml:3.1.0'
	implementation 'org.twdata.maven:mojo-executor:2.4.1'
	implementation 'commons-io:commons-io:2.22.0'
	implementation 'org.apache.commons:commons-lang3:3.21.0'
	implementation 'org.apache.commons:commons-collections4:4.6.0'
	implementation 'org.apache.commons:commons-compress:1.28.0'
	implementation 'org.apache.velocity:velocity-engine-core:2.4.1'
	implementation 'org.vafer:jdeb:1.14'
	implementation 'net.jsign:jsign-core:6.0'
	implementation 'org.redline-rpm:redline:1.2.10'
	implementation 'edu.sc.seis.launch4j:launch4j:3.0.7'

	compileOnly 'org.apache.maven.plugin-tools:maven-plugin-annotations:3.16.0'
	compileOnly 'javax.inject:javax.inject:1' // provided by Maven at runtime

	mavenEmbedder 'org.apache.maven:maven-embedder:3.9.16'
	mavenEmbedder 'org.apache.maven:maven-compat:3.9.16'	
	mavenEmbedder 'org.slf4j:slf4j-simple:1.7.36'
	mavenEmbedder 'org.apache.maven.resolver:maven-resolver-connector-basic:1.9.27'
	mavenEmbedder 'org.apache.maven.resolver:maven-resolver-transport-wagon:1.9.27'
	mavenEmbedder 'org.apache.maven.wagon:wagon-http:3.5.3'
	mavenEmbedder 'org.apache.maven.wagon:wagon-provider-api:3.5.3'
}

group = 'io.github.javapackager'
version = '2.0.0-SNAPSHOT'
description = 'Hybrid Maven/Gradle plugin to package Java applications as native Windows, Mac OS X or GNU/Linux executables and create installers for them'

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

compileJava.options.encoding = 'UTF-8'

// suppress javadoc warnings
javadoc.options.addStringOption('Xdoclint:none', '-quiet')

java {
	withSourcesJar()
	withJavadocJar()
}

// OSSRH publication
publishing {
	repositories {
		maven {
            def releasesRepoUrl = "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
            // snapshots go to the Central Portal (OSSRH was shut down); credentials are a Central Portal user token
            def snapshotsRepoUrl = "https://central.sonatype.com/repository/maven-snapshots/"
			name = "OSSRH"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl			
			credentials {
				username = project.findProperty("ossrhUsername") ?: ''
				password = project.findProperty("ossrhPassword") ?: ''
			}
		}
	}
	publications {
		pluginMaven(MavenPublication) {
			def directory = buildDir.canonicalPath
			def outputDirectory = compileJava.destinationDirectory.asFile.get().canonicalPath
			pom.withXml {
				asNode().appendNode('build')
						.with {
							appendNode('directory', directory)
							appendNode('outputDirectory', outputDirectory)
							// keeps the 'javapackager:' goal prefix (maven-plugin-plugin can't compute it from the artifactId)
							appendNode('plugins').appendNode('plugin').with {
								appendNode('groupId', 'org.apache.maven.plugins')
								appendNode('artifactId', 'maven-plugin-plugin')
								appendNode('version', mavenPluginPluginVersion)
								appendNode('configuration').appendNode('goalPrefix', 'javapackager')
							}
						}
				asNode().appendNode('repositories').appendNode('repository')
						.with {
							appendNode('id', 'gradle')
							appendNode('name', 'Gradle Plugin Portal')
							appendNode('url', 'https://plugins.gradle.org/m2/')
						}
				// Maven provides its own API to plugins: maven-plugin-api and maven-core must be 'provided' and
				// mojo-executor and jdeb (also Maven plugins) must not bring other Maven versions
				// (Gradle consumers use the .module file, so they are not affected)
				asNode().dependencies.dependency.each { dep ->
					def artifactId = dep.artifactId.text()
					if (artifactId in ['maven-plugin-api', 'maven-core']) {
						dep.scope[0].value = 'provided'
					} else if (artifactId in ['mojo-executor', 'jdeb']) {
						dep.appendNode('exclusions').appendNode('exclusion').with {
							appendNode('groupId', 'org.apache.maven')
							appendNode('artifactId', '*')
						}
					}
				}
			}
			pom {
				name = project.name
				groupId = project.group
				artifactId = project.name
				packaging = 'maven-plugin'
			}
		}
	}

	afterEvaluate {
		publications {
			withType(MavenPublication) {
				// customize all publications here
				pom {
					version = project.version
					description = project.description
					url = 'https://github.com/javapackager/JavaPackager'
					scm {
						connection = 'scm:git:git://github.com/javapackager/JavaPackager.git'
						developerConnection = 'scm:git:git@github.com:javapackager/JavaPackager.git'
						url = 'https://github.com/javapackager/JavaPackager'
					}
					licenses {
						license {
							name = 'GPL-v3.0'
							url = 'http://www.gnu.org/licenses/gpl-3.0.txt'
							distribution = 'repo'
						}
					}
					developers {
						developer {
							id = 'fvarrui'
							name = 'Francisco Vargas Ruiz'
							url = 'https://github.com/fvarrui'
						}
					}
				}
			}
		}
	}
}

// runs the plugin description generator
tasks.register('generatePluginDescriptor', JavaExec) {
	dependsOn compileJava
	def pluginDescriptorFile = new File(project.compileJava.destinationDirectory.asFile.get(), 'META-INF/maven/plugin.xml')

	// FIXME: this does not seem to be working
	inputs.files project.compileJava.outputs.files
	outputs.file pluginDescriptorFile

	classpath = configurations.mavenEmbedder
	mainClass = 'org.apache.maven.cli.MavenCli'
	systemProperties['maven.multiModuleProjectDirectory'] = projectDir
	args = [
			'--errors',
			'--batch-mode',
			'--file', generatePomFileForPluginMavenPublication.destination,
			"org.apache.maven.plugins:maven-plugin-plugin:${mavenPluginPluginVersion}:descriptor",
			'-Dproject.build.sourceEncoding=' + compileJava.options.encoding
	]
	doLast {
		assert pluginDescriptorFile.file, "${pluginDescriptorFile.canonicalPath}: was not generated"
		logger.info("Plugin descriptor is generated in ${pluginDescriptorFile.canonicalPath}")
	}
}
generatePluginDescriptor.dependsOn(generatePomFileForPluginMavenPublication)

project.classes.dependsOn(generatePluginDescriptor)
project.validatePlugins.dependsOn(generatePluginDescriptor)
publishToMavenLocal.dependsOn(build)

// Signature of publication
signing {
	setRequired {
		// signing is only required if release artifacts are to be published (snapshots aren't validated)
		!version.endsWith('SNAPSHOT') && gradle.taskGraph.allTasks.any { it instanceof PublishToMavenRepository }
	}
	sign publishing.publications.pluginMaven
}

nexusStaging {
	username = project.findProperty('ossrhUsername') ?: ''
	password = project.findProperty('ossrhPassword') ?: ''
}

tasks.register('updateWhyJavaLauncher', Download) {
	def version = '1.1.2'
	group 'Update assets'
	description 'Downloads JavaLauncher.exe to src/main/resources/windows and overwrites the existing one.'
	src([
			"https://github.com/AstroImageJ/Why/releases/download/${version}/JavaLauncher.exe"
	])
	dest file('src/main/resources/windows')
	overwrite true
}
