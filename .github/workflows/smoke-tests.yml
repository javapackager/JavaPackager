name: Smoke tests

on:
  push:
    branches: [ devel, master ]
  pull_request:
    branches: [ devel, master ]
  workflow_dispatch:

jobs:
  macos:
    name: ${{ matrix.os }} / ${{ matrix.macStartup }}${{ matrix.admin && ' / admin' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, macos-15 ]
        macStartup: [ UNIVERSAL, ARM64, SCRIPT ]
        admin: [ false ]
        include:
          - os: macos-15
            macStartup: SCRIPT
            admin: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build and install plugin to Maven local
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Get plugin version
        id: plugin
        run: echo "version=$(./gradlew properties -q --no-daemon | awk '/^version:/ {print $2}' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Package sample app
        working-directory: samples/hello-world
        run: |
          mvn -B package \
            -Djavapackager.version=${{ steps.plugin.outputs.version }} \
            -DmacStartup=${{ matrix.macStartup }} \
            -DadministratorRequired=${{ matrix.admin }} \
            2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Check generated app
        run: bash .github/scripts/check-macos-app.sh samples/hello-world/target ${{ matrix.macStartup }} ${{ matrix.admin }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hello-world-${{ matrix.os }}-${{ matrix.macStartup }}${{ matrix.admin && '-admin' || '' }}
          path: |
            samples/hello-world/build.log
            samples/hello-world/target/*.dmg
            samples/hello-world/target/*.pkg
          if-no-files-found: ignore

  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install FUSE 2 (needed by appimagetool)
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64

      - name: Build and install plugin to Maven local
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Get plugin version
        id: plugin
        run: echo "version=$(./gradlew properties -q --no-daemon | awk '/^version:/ {print $2}' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Package sample app
        working-directory: samples/hello-world
        run: |
          mvn -B package -Djavapackager.version=${{ steps.plugin.outputs.version }} 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Check generated app
        run: bash .github/scripts/check-linux-app.sh samples/hello-world/target

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hello-world-ubuntu-latest
          path: |
            samples/hello-world/build.log
            samples/hello-world/target/*.deb
            samples/hello-world/target/*.rpm
            samples/hello-world/target/*.AppImage
          if-no-files-found: ignore

  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Inno Setup (if missing)
        run: |
          if ! command -v iscc > /dev/null; then
            choco install innosetup -y --no-progress
          fi
          echo "C:\\Program Files (x86)\\Inno Setup 6" >> "$GITHUB_PATH"

      - name: Install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"

      - name: Build and install plugin to Maven local
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Get plugin version
        id: plugin
        run: echo "version=$(./gradlew properties -q --no-daemon | awk '/^version:/ {print $2}' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Package sample app
        working-directory: samples/hello-world
        run: |
          command -v iscc
          wix --version
          mvn -B package -Djavapackager.version=${{ steps.plugin.outputs.version }} 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Check generated app
        run: bash .github/scripts/check-windows-app.sh samples/hello-world/target

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hello-world-windows-latest
          path: |
            samples/hello-world/build.log
            samples/hello-world/target/*.exe
            samples/hello-world/target/*.msi
            samples/hello-world/target/*.msm
          if-no-files-found: ignore
